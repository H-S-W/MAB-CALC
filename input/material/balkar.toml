# (styvhet) men inte EA. För ramanalysen måste EA HÄRLEDAS ur
# EA = E_f*A_f + E_liv*A_liv med E_f ur [flans] och E_liv ur skivbibliotekets
# EN 12369-värde för livmaterialet. Det är en härledning, inte en deklarerad
# egenskap, och ska redovisas som ett antagande.
EA = "HÄRLETT — se kommentar"

