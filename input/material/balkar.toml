en338 = "C18"

# ---------------------------------------------------------------------------
# TVÄRSNITTSGEOMETRI — ETA tab. 1 och tabellrubrikerna i tab. 11/12
#
# Måtten i tab. 11/12 skrivs "47x47 mm flanges" osv. Första talet är
# flänsens HÖJD h_f, andra talet flänsens BREDD b_f. Det är verifierat mot
# ETA:ns egen tröghetsradie i sidled: i_y = b_f/sqrt(12) ger 47/3,464 =
# 13,6 mm mot tabellens 0,013 m, 60 -> 0,017, 70 -> 0,020, 97 -> 0,028.
# Alla fyra serier stämmer.
#
# h_liv = h - 2*h_f    fri livhöjd mellan flänsarna
# c_flans = h - h_f    c/c mellan flänsarnas tyngdpunkter (= handbokens
#                      x-mått 253 mm för H300, se handboken s. 288)
# ---------------------------------------------------------------------------

[serie.H]
h_flans = 47.0
b_flans = 47.0
t_liv = 10.0
sidostod_max = 350.0        # mm, ETA tab. 19

[serie.HM]
h_flans = 47.0
b_flans = 60.0
t_liv = 10.0
sidostod_max = 500.0

[serie.HI]
h_flans = 47.0
b_flans = 70.0
t_liv = 10.0
sidostod_max = 600.0

[serie.HB]
h_flans = 47.0
b_flans = 97.0
t_liv = 10.0
sidostod_max = 1000.0

