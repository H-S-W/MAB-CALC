# ---------------------------------------------------------------------------
# k_def FÖR BALKEN — ETA tab. 18
#
# Skjuvdeformationen kryper VÄSENTLIGT mer än böjdeformationen, och P5-liv
# mer än OSB. Nedböjning i bruksgränstillstånd måste därför delas upp i en
# böjdel och en skjuvdel med olika k_def — man kan inte använda ett enda
# k_def för hela nedböjningen.
# ---------------------------------------------------------------------------

[kdef.bojning_axial]
kk1 = 0.60
kk2 = 0.80

[kdef.skjuvning]
osb_p7_kk1 = 1.50
p5_kk1     = 2.25
osb_p7_kk2 = 2.25
p5_kk2     = 3.00

# ---------------------------------------------------------------------------
# UPPLAGSKAPACITET — ETA avsn. 1.2.3, tab. 6-9
#
# Utan förstärkning, MED punktlast över upplag  (ekv. 3):
#     F_k = (L1/45)^0.5 * a * k_A * k_6
# Med förstärkning, UTAN punktlast över upplag  (ekv. 4):
#     F_k = (L1/45)^0.5 * a * k_B * k_7
#
# a för ändupplag = a_and_bas + delta_a, där (ekv. 5)
#     delta_a = 4 * y / (h/2)      y = utstick utanför upplaget
#
# Effektiv upplagslängd: ändupplag L1 = min(L1, 150), mitt-/innerupplag
# L1 = min(L1, 200). För h <= 220 räknas upplagskapaciteten med L1 = 150.
# Om L2 < L1 ska L2 användas som upplagslängd. Vid ändupplag där y > h ska
# kapaciteten räknas som mittstöd.
#
# ETA fotnot: resultatet måste alltid kontrolleras mot balkens
# tvärkraftskapacitet nära upplaget — F_d <= V_d vid ändupplag,
# F_d <= 2*V_d vid mittstöd.
#
# Minsta tillåtna upplagslängd är 45 mm (ETA annex 3).
# ---------------------------------------------------------------------------

[upplag.a]
# ETA tab. 6
H  = { and_bas = 9.0,  mitt = 14.0 }
HL = { and_bas = 8.5,  mitt = 13.0 }
HM = { and_bas = 9.5,  mitt = 15.0 }
