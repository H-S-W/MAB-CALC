# ---------------------------------------------------------------------------
# k_mod FÖR BALKEN — ETA tab. 17
#
# Dessa värden gäller balken som produkt och ersätter EN 1995-1-1 tab. 3.1
# för lättbalken. Notera att tvärkraft har EGNA, LÄGRE värden som beror på
# livmaterialet — det är inte samma k_mod som för böjning.
#
# Fotnot till ETA tab. 17: tvärkraftskolumnen gäller även upplagskapacitet
# enligt figur 2 MED punktlast ovanifrån UTAN förstärkning, för h >= 250 vid
# ändupplag och h >= 300 vid innerupplag/mittstöd.
# ---------------------------------------------------------------------------

[kmod.bojning_upplag_axial]
