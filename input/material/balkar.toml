# ---------------------------------------------------------------------------
# LÄTTBALKAR — deklarerade värden ur tillverkarens ETA
#
# KÄLLA: Masonite Beams ETA 12/0018, utgiven 2023-10-26 av RISE Research
#        Institutes of Sweden AB, mot EAD 130367-00-0304 "Composite
#        wood-based beams and columns". Ersätter ETA 12/0018 av 2023-05-11.
#        Dokumentets löpnummer: 1220846. 22 sidor inkl. 3 annex.
#
# Handboken (The I-joist Handbook, 1:a uppl. 2022) publicerar INTE dessa
# värden utan hänvisar till ETA:n, se handboken s. 42 och s. 43. Notera att
# handboken s. 36 anger ETA 08/0012 medan s. 42-43 anger ETA 12/0018 — det
# är 12/0018 som är den gällande, och den som gäller för värdena nedan.
#
# INGA VÄRDEN I DEN HÄR FILEN ÄR PLATSHÅLLARE. Varje tal är avläst ur
# ETA:ns tabeller och tabellnumret står vid varje block. Undantagen är
# uttryckligen märkta med SAKNAS eller HÄRLETT.
# ---------------------------------------------------------------------------

[metadata]
kalla = "Masonite Beams ETA 12/0018, 2023-10-26 (RISE)"
ead = "EAD 130367-00-0304"
tillverkare = "Masonite Beams AB, Rundvik"
klimatklasser = [1, 2]          # ETA avsn. 2: begränsat till klimatklass 1 och 2
avlast_av_claude = "2026-08-17"

# ---------------------------------------------------------------------------
# FLÄNSMATERIAL — ETA tab. 4 (f_m,k) och tab. 5 (E_f)
#
# f_m,k är den karakteristiska böjhållfastheten som motsvarar spänningen i
# flänsens yttersta fiber, angiven för balkhöjd 300 mm.
# E_f är flänsens elasticitetsmodul, MEDELVÄRDE.
#
# ETA avsn. 1.2.4: för axialkraftskapacitet räknas C30+ som C30 och
# C24+ som C24 enligt EN 338. Samma likställande används här för
# densiteten rho_k, som behövs för förbindarnas hålkantshållfasthet
# enligt EN 1995-1-1 8.3.1. Värdena är EN 338:s karakteristiska
# densiteter för motsvarande klass: C18 320, C24 350, C30 380 kg/m3.
#
# ETA avsn. 2.1 noterar att C24+ och C30+ kan ha något högre värden än
# EN 338:s C24 och C30. Att räkna med EN 338-värdet är därmed den
# konservativa och av ETA:n anvisade vägen.
# ---------------------------------------------------------------------------

# rho_mean behövs för förskjutningsmodulen K_ser (EN 1995-1-1 tab. 7.1),
# som räknas på MEDELdensiteten. Värdena är EN 338:s rho_mean för
# motsvarande klass: C18 380, C24 420, C30 460 kg/m3.

# UTGÅVESTATUS: ETA 12/0018 av 2023-10-26 (RISE, dok. 1220846, grund
# EAD 130367-00-0304) förutsätts gällande. Kontrollerat 2026-08-18: ingen
# nyare utgåva hittad, MEN status är inte bekräftad av utfärdaren och
# EOTA:s post för dokumentet ger 404. Se docs/ERRATA.md punkt 5b.
#
# ---------------------------------------------------------------------------
# SS-EN 338:2016 tabell 1 — karakteristiska värden för konstruktionsvirke
#
# ETA 12/0018 avsn. 1.2.4 (Axial force resistance) hänvisar hit:
#   "To be calculated according to EC5 using strength and stiffness values
#    in EN 338. For C30+ use the values for C30 and for C24+ use the
#    values for C24."
# Därför ligger hela raden här, inte bara densiteten. Kopplingen görs med
# nyckeln en338 i [flans.*] nedan.
#
# KÄLLOR (hämtade och korsprövade 2026-08-18, alla 27 värden identiska):
#   - SIST EN 338:2016 tab. 1 (slovensk antagning, ordagrann) — enda
#     lästa exemplaret av SJÄLVA standardtexten
#   - TräGuiden, Svenskt Trä: "Konstruktionsvirke", anger SS-EN 338:2016
#   - Svenskt Trä, "Dimensionering av träkonstruktioner del 2" 2016 tab 3.3
#   - dataholz.eu datablad vh (saknar rho_mean)
#
# ATT VETA:
#  - SS-EN 338:2016 har INTE lästs i svensk originalutgåva. EN-antagningar
#    är tekniskt ordagranna, men verifiera gärna mot ditt eget exemplar.
#  - E_0_05, E_0_mean, G_mean och densiteterna är OFÖRÄNDRADE mellan
#    2003, 2009 och 2016. f_t_0_k, f_c_0_k och f_v_k ÄNDRADES 2016.
#  - Kontrollera att en nedladdad PDF är utgåvan och inte utkastet
#    prEN 338:2013: utkastet har f_t_0_k för C24 = 14,0, utgåvan 14,5.
#  - f_v_k är lika för C24 och C30 (4,0). Det är riktigt, inte ett tryckfel.
#  - f_v_k gäller virke UTAN sprickor. EC5 med svensk NA kräver k_cr = 0,67
#    vid skjuvning av massivträ. Lättbalkens egen V_k kommer ur ETA:n och
#    berörs inte.
#  - Inre kontroll som stämmer: E_0_05 = 0,67*E_0_mean och
#    G_mean = E_0_mean/16 (EN 384) inom 0,5 % för alla tre klasserna.
# ---------------------------------------------------------------------------

[en338.C18]
f_m_k = 18.0
f_t_0_k = 10.0
f_c_0_k = 18.0
f_v_k = 3.4
E_0_mean = 9000.0
E_0_05 = 6000.0
G_mean = 560.0
rho_k = 320.0
rho_mean = 380.0

[en338.C24]
f_m_k = 24.0
f_t_0_k = 14.5
f_c_0_k = 21.0
f_v_k = 4.0
E_0_mean = 11000.0
E_0_05 = 7400.0
G_mean = 690.0
rho_k = 350.0
rho_mean = 420.0

[en338.C30]
f_m_k = 30.0
f_t_0_k = 19.0
f_c_0_k = 24.0
f_v_k = 4.0
E_0_mean = 12000.0
E_0_05 = 8000.0
G_mean = 750.0
rho_k = 380.0
rho_mean = 460.0

[flans.C30plus]
f_m_k = 27.0        # MPa
E_f = 13000.0       # MPa, medelvärde
rho_k = 380.0       # kg/m3, EN 338 för C30
rho_mean = 460.0    # kg/m3, EN 338 för C30
serier = ["H", "HI", "HM", "HB"]
en338 = "C30"

[flans.C24plus]
