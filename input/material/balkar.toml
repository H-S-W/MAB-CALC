[errata.eta_tab11_hb_ntk]
var = "ETA 12/0018, tab. 11, kolumn N_tk för HB-serien (s. 16 av 22)"
tryckt = "16.3, 18.4, 20.5, 21.5, 26.6, 31.4, 36.2, 40.9, 45.4"
problem = """
Kolumnen N_tk är för HB-serien identisk med kolumnen M_k, rad för rad, i
alla nio rader. Det kan inte vara riktigt: en dragkapacitet i kN kan inte
sammanfalla numeriskt med en momentkapacitet i kNm för varje balkhöjd.
För H-, HM- och HI-serierna gäller genomgående N_tk ~ 0,79 * N_ck. För HB
skulle det ge ca 175 kN vid HB200, inte 16,3 kN.

Att det är en kopieringsmiss bekräftas av tab. 12: HB-serien med
spånskiveliv har där N_tk = 173,3 till 184,5 kN, vilket ligger på just den
nivå som N_ck-kolumnen förutsäger. Det är alltså tab. 11 som är fel, inte
tab. 12.
"""
konsekvens = """
Dragkapaciteten för HB-balkar med OSB-liv är okänd i den här utgåvan av
ETA:n. Värdena är satta till -1 i [balk.osb] och programmet ska vägra
utnyttja HB med OSB-liv i drag tills värdet är bekräftat av Masonite Beams
eller RISE. Tryckkapaciteten N_ck är opåverkad och kan användas.
Spånskivevarianten HB...s är opåverkad.
"""

