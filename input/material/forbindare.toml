# ---------------------------------------------------------------------------
# FÖRBINDARE
#
# Handboken s. 284: "In all examples a 2.5 x 50 nail has been used, but of
# course another nail or screw can be used." Kapaciteten per förbindare
# räknas därför fram ur EN 1995-1-1 8.2.2 och 8.3.1 i
# src/forbindare_ec5.py — den ligger inte som ett fast tal i den här filen.
#
# Vad som ligger här är förbindarens EGNA egenskaper, alltså det som står i
# tillverkarens deklaration. Kapaciteten beror sedan på vad den spikas i.
#
# f_u  trådets draghållfasthet [MPa]. EN 14592 kräver minst 600 MPa för
#      spiktråd, och 600 är därför det konservativa utgångsvärdet. STÅR ETT
#      HÖGRE VÄRDE I DEKLARATIONEN, ANVÄND DET — f_u går rakt in i
#      flytmomentet, M_y,Rk = k * f_u * d^2,6 (ekv. 8.14).
#
# typ  styr två saker:
#        M_y,Rk        koefficient 0,30 för runda, 0,45 för rillade och
#                      kvadratiska (ekv. 8.14)
#        inträngning   8d för släta, 6d för övriga (8.3.1.1)
#      En ankarspik är ringad och räknas som "rillad". Är du osäker på om
#      din spik kvalificerar, välj "rund" — det är den konservativa vägen.
#
# F_ax_Rk  karakteristisk utdragskapacitet [N] för repeffekten. 0 = ingen
#          repeffekt. Kräver deklarerade utdragsparametrar enligt 8.3.2.
#          Handboken räknar inte med repeffekt i sina exempel, så 0 är det
#          spårbara valet.
# ---------------------------------------------------------------------------

[metadata]
kalla_metod = "EN 1995-1-1 8.2.2 och 8.3.1"
f_u_default_kalla = "EN 14592, minimikrav 600 MPa för spiktråd"
gamma_M_forband = 1.30       # EN 1995-1-1 tab. 2.3, förband

# ---------------------------------------------------------------------------
# SPIK
#
# Beteckningen d x l. Ankarspik 2,5x50 är den handboken räknar med i
# samtliga exempel i avsnitt 5.3.
# ---------------------------------------------------------------------------

[forbindare.ankarspik_2_5x50]
namn = "Ankarspik 2,5x50"
d = 2.5
langd = 50.0
f_u = 600.0
typ = "rillad"
forborrning = false
F_ax_Rk = 0.0
kommentar = "Handbokens referensspik i hela avsnitt 5.3"

