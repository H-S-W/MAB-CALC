# ---------------------------------------------------------------------------
# SKRUV — INTE IMPLEMENTERAD
#
# EN 1995-1-1 8.7.1 låter skruvar med ytterdiameter d <= 6 mm räknas med
# spikreglerna i 8.2, men då ska en EFFEKTIV diameter d_ef användas i
# stället för ytterdiametern, och för grövre skruvar gäller egna regler.
# Utdragskapaciteten enligt 8.7.2 är dessutom ofta det som styr för skruv,
# inte skjuvningen.
#
# Att köra en skruv genom spikformlerna med ytterdiametern överskattar
# kapaciteten. Modulen har därför ingen skruvgren, och den här filen har
# inga skruvposter. docs/ERRATA.md metodanmärkning gäller också här:
# grova skruvar är sprödare än spik, så summationen av gruppernas
# kapaciteter blir mindre försvarbar.
#
# Ska skruv in behövs d_ef ur deklarationen och 8.7.1/8.7.2 implementerade.
# ---------------------------------------------------------------------------

[ej_implementerat]
skruv = "Kräver d_ef och EN 1995-1-1 8.7.1/8.7.2, se kommentar ovan"
forborrade_hal = "f_h enligt ekv. 8.16 finns, men tab. 8.2:s avståndskrav för förborrade hål saknas"
